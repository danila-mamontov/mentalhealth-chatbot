welcome_message: "👋 欢迎！\n\n<b>本机器人是科学研究的一部分</b>，研究主题为抑郁状态的自动识别。\n\n📊 我们会收集信息，以<b>提升</b>自动识别的质量。\n\n🙏 若您愿意参与，我们将不胜感激。"
info_message: "❗ 如果在任何时候感到不适或需要帮助，强烈建议联系专业人士:\n📞 <b>求助热线:</b> (请提供相关联系方式)\n🏥 <b>专业帮助:</b> 如果您担心自己的情绪健康，请咨询心理学家或治疗师。\n👨‍👩‍👧‍👦 <b>与亲友交流:</b> 与值得信赖的亲友分享感受会有帮助。\n\n"
