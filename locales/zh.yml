consent_message: "数据保护信息与同意声明\n在科学研究中，会收集关于您的个人数据和医学结果。对这些与研究相关的数据的存储、评估和披露均依据法律规定进行，并在参与研究前需要您自愿的同意：\n1. 我同意在本研究过程中收集的资料/病情数据可以记录在问卷和电子载体上，并在未透露姓名的情况下处理。\n2. 此外，我同意保密的授权人员（例如委托方或大学的相关人员）在需要对项目进行审查时查阅我收集的个人数据。为此，我解除研究人员的职业保密义务。\n3. 我明白，我有权获得与我相关的个人数据的信息（包括免费的副本），并请求对其进行更正或删除。"
