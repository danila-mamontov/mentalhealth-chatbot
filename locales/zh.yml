phq9_survey_button: "开始问卷"
main_survey_button: "开始主问卷"
intro_phq9_message: "📋 问卷说明\n本问卷旨在了解您<b>过去两周</b>的情绪状态和心理健康水平。\n📊 结构:\n•  共22个问题，分为两部分\n•  第1部分：8个选择题\n•  第2部分：14个<b>语音回答</b>的开放式问题\n•  预计耗时：15-20分钟\n💡 指南:\n•  请根据真实感受作答，没有对错之分\n⚠️ 本问卷不提供心理诊断或治疗"
starting_phq9: "在<u>过去的2周</u>里，以下问题困扰您的频率是?"
end_phq9_message: "感谢您参与问卷!"
intro_main_message: "📝 在此调查中，我们将询问您一系列关于思想、感受和经历的问题。\n\n💡 <b>您将会看到:</b>\n  -<b>14个问题</b>，涉及情绪、心情及与他人的互动。\n  -您需要以<i><b>语音消息</b></i>回答问题。\n  -没有对错之分。\n  -您的回答<b>保密</b>，仅用于科学研究。"
main_survey_disclaimer_message: "💬 <b>如何回答：</b>\n\n对于每个问题，请通过录制语音消息提供<b>深思熟虑的详细答案</b>。我们建议：\n\n1️⃣ <b>大声读出问题</b> - 这有助于您完全理解所问的内容。\n\n2️⃣ <b>花点时间思考</b> - 思考问题和您的诚实答案。\n\n3️⃣ <b>开放和自然地说话</b> - 用您自己的话分享您的想法、感受和经历。没有正确或错误的答案。\n\n⏱️ <b>最短时长：</b>您的语音消息应至少<b>5秒</b>长。\n\n✨ 您详细而诚实的答案帮助我们更好地理解心理健康模式。感谢您！"
end_main_survey_message: "感谢您参与问卷!\n\n⚠️ <b>重要提示：</b>请不要忘记将您的ID告知协调员: <b>{user_id}</b>"
