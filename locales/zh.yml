reading_text_intro_msg: "📖 <b>下一阶段：文本阅读</b>\n\n请大声朗读以下文本片段，并发送包含您朗读内容的语音消息。\n\n<b>📌 说明：</b>\n1. 阅读以下文本\n2. 将其录制成语音消息\n3. 清晰自然地说话\n4. 发送语音消息"
reading_text_content_msg: "<b>要阅读的文本：</b>\n\n\"从前有个放羊的小男孩，他在一个村庄附近放羊，不远处是一片黑暗的森林。他觉得生活很无聊，所以决定开个玩笑。\n\n有一天，他想出了一个恶作剧：他突然跑向村庄，拼命大喊:"狼来了！狼来了！"村民们放下手中的活儿，冲向牧场，但那里没有狼，小男孩为他们的惊慌而大笑。\n\n他这样做了好几次。当一只真正的狼终于出现并开始攻击羊群时，小男孩惊恐地跑向村庄，又喊道:"狼来了！狼来了！"但这一次村民们不相信他，以为他又在开玩笑。\n\n狼杀死了很多羊并离开了，小男孩意识到，正因为他之前一次次的谎言，当真正需要帮助时，没有人来救他。\""
reading_text_instruction_msg: "🎙️ 请大声朗读文本并发送包含您朗读内容的语音消息。\n\n<b>💬 如何朗读：</b>\n1. 清晰明确地说话\n2. 保持自然的说话速度\n3. 最短录制时长 - 10 秒钟"
reading_text_recorded_msg: "✅ 已收到您的录音！感谢您参与本研究。"
reading_text_too_short_msg: "⏱️ 录音太短了。请完整阅读文本。最少时长 - 10 秒钟。"
