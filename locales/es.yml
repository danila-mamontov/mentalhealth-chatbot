share_bot_text: "Te invito a participar en un estudio científico sobre salud mental. ¡Usa este bot para ayudar a la ciencia!"
voice_answer_expected: "🎙️ Por favor responde con un mensaje de voz."
voice_too_short: "Los mensajes de voz deben durar al menos 30 segundos."
attention_check_instruction_msg: "Comprobación de atención: por favor, selecciona la opción {n} para esta pregunta."
reading_text_intro_msg: "📖 <b>Siguiente etapa: Lectura de texto</b>\n\nPor favor, lea en voz alta el siguiente pasaje de texto y envíe un mensaje de voz con su lectura.\n\n<b>📌 Instrucciones:</b>\n1. Lea el texto a continuación\n2. Grábelo en un mensaje de voz\n3. Hable con claridad y naturalidad\n4. Envíe el mensaje de voz"
reading_text_content_msg: "<b>Texto para leer:</b>\n\n\"Érase una vez un niño pastor que cuidaba un rebaño de ovejas cerca de un pueblo, no lejos de un bosque oscuro. La vida le parecía aburrida, así que decidió divertirse.\n\nUn día se le ocurrió una broma: corrió rápidamente al pueblo y gritó con todas sus fuerzas: \"¡Lobo! ¡Lobo!\" Los aldeanos dejaron sus tareas y corrieron al prado, pero no había ningún lobo, y el niño se reía de su pánico.\n\nHizo esto varias veces. Cuando finalmente apareció un lobo real y comenzó a atacar a las ovejas, el niño corrió aterrado al pueblo y volvió a gritar: \"¡Lobo! ¡Lobo!\" Pero esta vez los aldeanos no le creyeron, pensando que volvía a bromear.\n\nEl lobo mató a muchas ovejas y se fue, y el niño entendió que debido a sus falsos gritos, nadie vino en su ayuda cuando realmente la necesitaba.\""
reading_text_instruction_msg: "🎙️ Por favor, lea el texto en voz alta y envíe un mensaje de voz con su lectura.\n\n<b>💬 Cómo leer:</b>\n1. Hable con claridad y distinción\n2. Mantenga un ritmo natural del habla\n3. Duración mínima de la grabación - 10 segundos"
reading_text_confirm_msg: "✅ <b>¿Ha leído el texto completo?</b>\n\nPor favor, verifique que ha grabado completamente su lectura del texto antes de confirmar."
reading_text_recorded_msg: "✅ Su grabación ha sido recibida. ¡Gracias por participar en el estudio!"
reading_text_too_short_msg: "⏱️ La grabación es demasiado corta. Por favor, lea el texto completo. Duración mínima - 10 segundos."
