consent_message: "<b>Información y consentimiento sobre protección de datos</b>\n\nEn estudios científicos se recopilan datos personales y médicos sobre ti. El almacenamiento, evaluación y divulgación de estos datos relacionados con el estudio se realiza conforme a la ley y requiere el siguiente consentimiento voluntario antes de participar:\n1. Acepto que los datos e información médica recopilados puedan registrarse y procesarse de forma anonimizada.\n2. Acepto que una persona autorizada y sujeta a confidencialidad (por ejemplo, el patrocinador o la universidad) pueda revisar mis datos personales en la medida necesaria para la verificación del proyecto.\n3. Entiendo que tengo derecho a obtener información sobre mis datos personales, así como a solicitar su corrección o eliminación."
