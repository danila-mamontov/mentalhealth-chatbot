welcome_message: "👋 ¡Bienvenido!\n\n<b>Este bot es parte de un estudio científico</b> sobre el reconocimiento automático de estados depresivos.\n\n📊 Recopilamos información para <b>mejorar la calidad</b> de los métodos de reconocimiento automático.\n\n🙏 Estaremos muy agradecidos si decides participar."
info_message: "❗ Si en algún momento te sientes incómodo, angustiado o necesitas apoyo, te recomendamos buscar ayuda profesional:\n📞 <b>Líneas de apoyo:</b> (proporciona contactos relevantes)\n🏥 <b>Ayuda profesional:</b> Si tienes inquietudes sobre tu bienestar emocional, considera consultar a un psicólogo o terapeuta.\n👨‍👩‍👧‍👦 <b>Habla con tus seres queridos:</b> Compartir tus sentimientos con amigos o familia puede ayudar.\n\n"
