phq9_survey_button: "Iniciar la encuesta"
main_survey_button: "Iniciar encuesta principal"
intro_phq9_message: "📋 Instrucciones de la encuesta\nEsta encuesta busca comprender tu estado emocional y nivel de salud mental <b>durante las últimas dos semanas</b>.\n📊 Estructura:\n•  22 preguntas en total, divididas en dos partes\n•  Parte 1: 8 preguntas de opción múltiple\n•  Parte 2: 14 preguntas abiertas con <b>respuesta de voz</b>\n•  Tiempo estimado: 15-20 minutos\n💡 Guía de participación:\n•  Responde según tus verdaderos sentimientos, no hay respuestas correctas o incorrectas\n⚠️ Esta encuesta no proporciona diagnóstico o tratamiento psicológico"
starting_phq9: "En <u>las últimas 2 semanas</u>, ¿con qué frecuencia te han molestado los siguientes problemas?"
end_phq9_message: "¡Gracias por participar en la encuesta!"
intro_main_message: "📝 En esta encuesta, te haremos una serie de preguntas sobre tus pensamientos, sentimientos y experiencias.\n\n💡 <b>¿Qué esperar?</b>\n  -<b>14 preguntas</b> sobre tus emociones, estado de ánimo e interacciones con otros.\n  -No hay respuestas correctas o incorrectas.\n  -Tus respuestas son <b>confidenciales</b> y se utilizan solo para investigación científica."
end_main_survey_message: "¡Gracias por participar en la encuesta!"
main_survey_disclaimer_message: "💬 <b>Cómo responder:</b>\n\nPara cada pregunta, por favor proporciona una <b>respuesta reflexiva y detallada</b> grabando un mensaje de voz. Recomendamos:\n\n1️⃣ <b>Lee la pregunta en voz alta</b> - Esto te ayuda a entender completamente lo que se te pregunta.\n\n2️⃣ <b>Tómate un momento para reflexionar</b> - Piensa en la pregunta y tu respuesta honesta.\n\n3️⃣ <b>Habla abierta y naturalmente</b> - Comparte tus pensamientos, sentimientos y experiencias con tus propias palabras. No hay respuestas correctas o incorrectas.\n\n⏱️ <b>Duración mínima:</b> Tu mensaje de voz debe durar al menos <b>5 segundos</b>.\n\n✨ Tus respuestas detalladas y honestas nos ayudan a entender mejor los patrones de salud mental. ¡Gracias!"
end_main_survey_message: "¡Gracias por participar en la encuesta!\n\n⚠️ <b>Importante:</b> No olvides proporcionar tu ID al coordinador: <b>{user_id}</b>"
end_main_survey_message: "¡Gracias por participar en la encuesta!\n\n⚠️ <b>Importante:</b> No olvides proporcionar tu ID al coordinador: <b>{user_id}</b>"
