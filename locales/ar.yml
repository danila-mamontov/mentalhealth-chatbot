treatment_selection: "هل تتناول مضادات الاكتئاب حاليًا أو مؤخرًا؟"
welcome_message: "👋 مرحباً!\n\n<b>هذا البوت جزء من دراسة علمية</b> حول التعرف الآلي على الحالات الاكتئابية.\n\n📊 نجمع معلومات للمساعدة على <b>تحسين جودة</b> أساليب التعرف الآلي.\n\n🙏 سنكون ممتنين جداً لمشاركتك."
info_message: "❗ إذا شعرت في أي وقت بعدم ارتياح أو ضيق أو كنت بحاجة إلى دعم، ننصحك بشدة بالتواصل مع المختصين:\n📞 <b>خطوط المساعدة:</b> (أضف جهات الاتصال المناسبة)\n🏥 <b>مساعدة مهنية:</b> إذا كانت لديك مخاوف بشأن صحتك النفسية، فكّر في استشارة أخصائي نفسي أو معالج.\n👨‍👩‍👧‍👦 <b>تحدث مع المقربين:</b> مشاركة مشاعرك مع أصدقاء أو أفراد عائلة موثوقين قد تكون مفيدة.\n\n"
main_menu_message: "<b>القائمة</b>\nيرجى اختيار خيار:"
final_menu_message: "<b>القائمة</b>\nيرجى مشاركة الروبوت مع أصدقائك لمساعدتنا في جمع المزيد من البيانات للدراسة."
phq9_survey_button: "بدء الاستبيان"
main_survey_button: "بدء الاستبيان الرئيسي"
intro_phq9_message: "📋 تعليمات الاستبيان\nيهدف هذا الاستبيان إلى فهم حالتك العاطفية ومستوى صحتك النفسية <b>خلال الأسبوعين الماضيين</b>.\n📊 هيكل الاستبيان:\n•  22 سؤالًا، مقسمة إلى قسمين\n•  القسم 1: 8 أسئلة اختيار من متعدد\n•  القسم 2: 14 سؤالًا بإجابات <b>صوتية مفتوحة</b>\n•  الوقت المقدر: 15–20 دقيقة\n💡 إرشادات المشاركة:\n•  يُرجى الإجابة بناءً على مشاعرك الحقيقية، لا توجد إجابات صحيحة أو خاطئة\n⚠️ هذا الاستبيان لا يقدّم تشخيصًا نفسيًا ولا خدمات علاجية"
starting_phq9: "خلال <u>الأسبوعين الماضيين</u>، ما مدى تكرار إزعاجك بأيٍّ من المشاكل التالية؟"
end_phq9_message: "شكرًا لمشاركتك في الاستبيان!"
intro_main_message: "📝 في هذا الاستبيان، سنطرح عليك سلسلة من الأسئلة حول أفكارك ومشاعرك وتجاربك.\n\n💡 <b>ماذا تتوقع؟</b>\n  - <b>14 سؤالًا</b> عن عواطفك ومزاجك وتفاعلك مع الآخرين.\n  - تحتاج إلى الإجابة عن الأسئلة عبر <i><b>تسجيل رسائل صوتية</b></i>.\n  - لا توجد إجابات صحيحة أو خاطئة.\n  - إجاباتك <b>سرّية</b> وتُستخدم للأغراض البحثية العلمية فقط."
main_survey_disclaimer_message: "💬 <b>كيفية الإجابة:</b>\n\nبالنسبة لكل سؤال، يرجى تقديم <b>إجابة مدروسة وتفصيلية</b> عن طريق تسجيل رسالة صوتية. ننصحك بـ:\n\n1️⃣ <b>اقرأ السؤال بصوت عالٍ</b> - هذا يساعدك على فهم ما يُطلب منك بشكل كامل.\n\n2️⃣ <b>خذ لحظة للتفكير</b> - فكر في السؤال وفي إجابتك الصادقة.\n\n3️⃣ <b>تحدث بصراحة وطبيعية</b> - شارك أفكارك ومشاعرك وتجاربك بكلماتك الخاصة. لا توجد إجابات صحيحة أو خاطئة.\n\n⏱️ <b>الحد الأدنى للمدة:</b> يجب أن تستمر رسالتك الصوتية لمدة <b>5 ثوان على الأقل</b>.\n\n✨ إجاباتك المفصلة والصادقة تساعدنا على فهم أنماط الصحة النفسية بشكل أفضل. شكراً لك!"
end_main_survey_message: "شكرًا لمشاركتك في الاستبيان!"
voice_out_of_survey: "أنت خارج سياق الاستبيان الذي يتطلب إجابات صوتية. لبدء الاستبيان من جديد، اكتب /start."
voice_recieved: "تم استلام رسالتك الصوتية. إذا أردت إرسال إجابة أخرى، فالرجاء فعل ذلك. وإلا، يمكنك الانتقال إلى السؤال التالي أو السابق."
share_bot_button: "مشاركة البوت"
share_bot_text: "أدعوكم للمشاركة في دراسة علمية حول الصحة النفسية. استخدموا هذا البوت لمساعدة الباحثين والإسهام في العلم!"
voice_answer_expected: "🎙️ يرجى الإجابة برسالة صوتية."
voice_too_short: "يجب أن يكون طول الرسالة الصوتية 30 ثانية على الأقل."
attention_check_instruction_msg: "فحص الانتباه: يُرجى اختيار الخيار {n} لهذا السؤال."
reading_text_intro_msg: "📖 <b>المرحلة التالية: قراءة النص</b>\n\nيرجى قراءة النص التالي بصوت عال وإرسال رسالة صوتية مع قراءتك.\n\n<b>📌 التعليمات:</b>\n1. اقرأ النص أدناه\n2. سجله في رسالة صوتية\n3. تحدث بوضوح وبشكل طبيعي\n4. أرسل الرسالة الصوتية"
reading_text_content_msg: "<b>النص المراد قراءته:</b>\n\n\"كان هناك يومًا راعي أغنام صغير يرعى قطيعًا من الأغنام بالقرب من قرية، بعيدًا عن غابة مظلمة. بدت له الحياة مملة، فقرر أن يستمتع قليلاً.\n\nفي أحد الأيام، ابتكر خدعة: ركض بسرعة إلى القرية وصرخ بكل قوته: \"ذئب! ذئب!\" ترك أهل القرية أعمالهم وأسرعوا إلى الحقل، لكن لم يكن هناك ذئب، والصبي يضحك على خوفهم.\n\nفعل هذا عدة مرات. عندما ظهر ذئب حقيقي أخيرًا وبدأ في مهاجمة الأغنام، ركض الصبي إلى القرية في رعب وصرخ مرة أخرى: \"ذئب! ذئب!\" لكن هذه المرة لم يصدقه أهل القرية، معتقدين أنه يخدعهم مرة أخرى.\n\nقتل الذئب الكثير من الأغنام وغادر، وأدرك الصبي أنه بسبب صرخاته الكاذبة، لم يأتِ أحد لمساعدته عندما كان الأمر بأمس الحاجة.\""
reading_text_instruction_msg: "🎙️ يرجى قراءة النص بصوت عال وإرسال رسالة صوتية مع قراءتك.\n\n<b>💬 كيفية القراءة:</b>\n1. تحدث بوضوح وجلاء\n2. حافظ على وتيرة طبيعية للكلام\n3. الحد الأدنى لمدة التسجيل - 10 ثوانٍ"
reading_text_confirm_msg: "✅ <b>هل قرأت النص بالكامل؟</b>\n\nيرجى التحقق من أنك سجلت قراءتك للنص بالكامل قبل التأكيد."
reading_text_recorded_msg: "✅ تم استلام تسجيلك! شكرًا لمشاركتك في الدراسة."
reading_text_too_short_msg: "⏱️ التسجيل قصير جدًا. يرجى قراءة النص كاملاً. الحد الأدنى للمدة - 10 ثوانٍ."

