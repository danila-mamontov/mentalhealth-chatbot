intro_phq9_message: "📋 Instructions du questionnaire\nCe questionnaire vise à comprendre votre état émotionnel et votre santé mentale <b>sur les deux dernières semaines</b>.\n📊 Structure : 22 questions (8 choix multiples + 14 réponses vocales)\n⏱️ 15–20 minutes\n💡 Répondez selon vos ressentis, pas de bonnes/mauvaises réponses."
starting_phq9: "Au cours <u>des 2 dernières semaines</u>, à quelle fréquence avez-vous été gêné par les problèmes suivants ?"
end_phq9_message: "Merci de votre participation !"
intro_main_message: "📝 Nous poserons une série de questions sur vos pensées, sentiments et expériences.\nAttendez-vous à 14 questions et des réponses vocales."
end_main_survey_message: "Merci d'avoir participé à cette enquête !"
main_survey_disclaimer_message: "💬 <b>Comment répondre :</b>\n\nPour chaque question, veuillez fournir une <b>réponse réfléchie et détaillée</b> en enregistrant un message vocal. Nous recommandons :\n\n1️⃣ <b>Lisez la question à haute voix</b> - Cela vous aide à bien comprendre ce qui est demandé.\n\n2️⃣ <b>Prenez un moment pour réfléchir</b> - Pensez à la question et à votre réponse honnête.\n\n3️⃣ <b>Parlez ouvertement et naturellement</b> - Partagez vos pensées, sentiments et expériences avec vos propres mots. Il n'y a pas de bonnes ou mauvaises réponses.\n\n⏱️ <b>Durée minimale :</b> Votre message vocal doit durer au moins <b>5 secondes</b>.\n\n✨ Vos réponses détaillées et honnêtes nous aident à mieux comprendre les modèles de santé mentale. Merci !"
end_main_survey_message: "Merci d'avoir participé à cette enquête !"
end_main_survey_message: "Merci de votre participation !\n\n⚠️ <b>Important:</b> N'oubliez pas de communiquer votre ID au coordinateur: <b>{user_id}</b>"
