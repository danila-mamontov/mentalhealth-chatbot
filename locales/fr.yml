welcome_message: "👋 Bienvenue !\n\n<b>Ce bot fait partie d'une étude scientifique</b> sur la reconnaissance automatique des états dépressifs.\n\n📊 Nous recueillons des informations afin d'<b>améliorer la qualité</b> des méthodes de reconnaissance automatique.\n\n🙏 Nous vous serions très reconnaissants si vous acceptiez de participer."
info_message: "❗ Si à tout moment vous ressentez une gêne ou avez besoin de soutien, contactez des professionnels :\n📞 <b>Lignes d'assistance :</b> (contacts)\n🏥 <b>Aide professionnelle :</b> Consultez un psychologue si nécessaire.\n👨‍👩‍👧‍👦 <b>Parlez à des proches :</b> Partager vos sentiments peut aider.\n\n"
