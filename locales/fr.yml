reading_text_intro_msg: "📖 <b>Étape suivante: Lecture de texte</b>\n\nVeuillez lire à haute voix le passage de texte suivant et envoyer un message vocal avec votre lecture.\n\n<b>📌 Instructions:</b>\n1. Lisez le texte ci-dessous\n2. Enregistrez-le dans un message vocal\n3. Parlez clairement et naturellement\n4. Envoyez le message vocal"
reading_text_content_msg: "<b>Texte à lire:</b>\n\n\"Il était une fois un jeune berger qui gardait un troupeau de moutons près d'un village, non loin d'une forêt sombre. La vie lui semblait ennuyeuse, alors il décida de s'amuser.\n\nUn jour, il inventa une blague: il courut rapidement au village et cria de toutes ses forces: \"Loup! Loup!\" Les villageois ont abandonné leurs tâches et se sont précipités dans le pâturage, mais il n'y avait pas de loup, et le garçon riait de leur panique.\n\nIl fit cela plusieurs fois. Quand un vrai loup apparut enfin et commença à attaquer les moutons, le garçon courut terrifié au village et cria à nouveau: \"Loup! Loup!\" Mais cette fois, les villageois ne le crurent pas, pensant qu'il plaisantait à nouveau.\n\nLe loup tua de nombreux moutons et s'en alla, et le garçon comprit que à cause de ses fausses clameurs, personne ne vint l'aider quand l'aide était vraiment nécessaire.\""
reading_text_instruction_msg: "🎙️ Veuillez lire le texte à haute voix et envoyer un message vocal avec votre lecture.\n\n<b>💬 Comment lire:</b>\n1. Parlez clairement et distinctement\n2. Maintenez un rythme de parole naturel\n3. Durée d'enregistrement minimale - 10 secondes"
reading_text_recorded_msg: "✅ Votre enregistrement a été reçu! Merci de participer à l'étude."
reading_text_too_short_msg: "⏱️ L'enregistrement est trop court. Veuillez lire le texte complet. Durée minimale - 10 secondes."
