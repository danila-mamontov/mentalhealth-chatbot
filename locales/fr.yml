consent_message: "<b>Information et consentement sur la protection des données</b>\n\nDans les études scientifiques, des données personnelles et médicales sont recueillies. Leur stockage et transmission respectent la loi et nécessitent votre accord préalable :\n1. J'accepte que les données collectées soient enregistrées et traitées de manière anonymisée.\n2. J'autorise une personne habilitée et soumise au secret professionnel (ex. promoteur ou université) à consulter mes données si nécessaire pour la vérification du projet.\n3. Je comprends pouvoir obtenir des informations (copie gratuite incluse) sur mes données personnelles et demander leur rectification ou suppression."
