attention_check_instruction_msg: "Перевірка уваги: будь ласка, виберіть варіант {n} для цього запитання."
reading_text_intro_msg: "📖 <b>Наступний етап: Читання тексту</b>\n\nБудь ласка, прочитайте наступний текст вголос і надішліть голосове повідомлення з вашим читанням.\n\n<b>📌 Інструкції:</b>\n1. Прочитайте текст нижче\n2. Запишіть його вголос у голосове повідомлення\n3. Говоріть чітко і природно\n4. Надішліть голосове повідомлення"
reading_text_content_msg: "<b>Текст для читання:</b>\n\n\"Жив‑був хлопчик‑пастух, який пас отару овець біля села, неподалік від темного лісу. Життя йому здавалось нудним, і він вирішив розважитися.\n\nОдного разу він вигадав жарт: раптово побіг до села і кричав з усіх сил: «Вовк! Вовк!» Селяни кинули свої справи і прибігли на пасовисько, але там не було ні вовка, і хлопчик сміявся над їхнім переполохом.\n\nТак він поступав кілька разів. Коли, нарешті, справжній вовк з'явився і почав нападати на овець, хлопчик в ужасі побіг до села і знову кричав: «Вовк! Вовк!» Але цього разу селяни йому не повірили, подумавши, що він знову жартує.\n\nВовк розтерзав багато овець і пішов, а хлопчик зрозумів, що через свої неправдиві крики ніхто не прийшов на допомогу, коли допомога була дійсно потрібна.\""
reading_text_instruction_msg: "🎙️ Будь ласка, прочитайте текст вголос і надішліть голосове повідомлення з вашим читанням.\n\n<b>💬 Як читати:</b>\n1. Говоріть чітко і розбірливо\n2. Дотримуйтесь природного темпу мовлення\n3. Мінімальна довжина запису - 10 секунд"
reading_text_confirm_msg: "✅ <b>Ви повністю прочитали текст?</b>\n\nБудь ласка, перевірте, що ви повністю записали ваше читання тексту, перед підтвердженням."
reading_text_recorded_msg: "✅ Вашу запис отримано! Дякуємо за участь у дослідженні."
reading_text_too_short_msg: "⏱️ Запис занадто короткий. Будь ласка, прочитайте текст повністю. Мінімальна довжина - 10 секунд."
