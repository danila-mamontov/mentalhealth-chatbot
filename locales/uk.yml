welcome_message: "👋 Ласкаво просимо!\n\n<b>Цей бот — частина наукового дослідження</b> з автоматичного розпізнавання депресивних станів.\n\n📊 Ми збираємо інформацію, щоб <b>покращити якість</b> методів автоматичного розпізнавання.\n\n🙏 Ми будемо дуже вдячні, якщо ви візьмете участь."
info_message: "❗ Якщо в будь-який момент ви відчуєте дискомфорт або потребуєте підтримки, радимо звернутися до професіоналів:\n📞 <b>Гарячі лінії підтримки:</b> (додайте відповідні контакти)\n🏥 <b>Професійна допомога:</b> Якщо вас турбує ваш емоційний стан, зверніться до психолога чи терапевта.\n👨‍👩‍👧‍👦 <b>Поговоріть з близькими:</b> Поділитися своїми почуттями з друзями або родиною може бути корисно.\n\n"
main_menu_message: "<b>Меню</b>\n\nВаш ID: <b>{user_id}</b>\nБудь ласка, повідомте його координатору.\n\nБудь ласка, оберіть опцію:"
final_menu_message: "<b>Меню</b>\nПоділіться ботом з друзями та допоможіть зібрати більше даних для дослідження."
