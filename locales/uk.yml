consent_message: "<b>Інформація та згода щодо захисту даних</b>\n\nУ наукових дослідженнях про вас збираються персональні та медичні дані. Зберігання, оцінка та передача цих даних здійснюється відповідно до законодавства і потребує вашої добровільної згоди перед участю в дослідженні:\n1. Я погоджуюсь, що зібрані дані можуть оброблятися у знеособленому вигляді.\n2. Я дозволяю уповноваженим особам, які зобов'язані зберігати таємницю (напр., спонсору або університету), переглядати мої персональні дані, якщо це необхідно для перевірки проєкту.\n3. Я розумію, що маю право отримати інформацію про свої персональні дані, а також вимагати їх виправлення або видалення."
