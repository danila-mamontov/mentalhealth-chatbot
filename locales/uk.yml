intro_phq9_message: "📋 Інструкція до опитування\nЦе опитування допомагає зрозуміти ваш емоційний стан та рівень психічного здоров'я <b>за останні два тижні</b>."
starting_phq9: "За <u>останні 2 тижні</u>, як часто вас турбували наступні проблеми?"
end_phq9_message: "Дякуємо за участь в опитуванні!"
intro_main_message: "📝 У цьому опитуванні ми поставимо вам серію запитань про ваші думки, почуття та досвід."
main_survey_disclaimer_message: "💬 <b>Як відповідати:</b>\n\nДля кожного запитання, будь ласка, надайте <b>вдумливу та детальну відповідь</b>, записавши голосове повідомлення. Ми рекомендуємо:\n\n1️⃣ <b>Прочитайте запитання голосно</b> - Це допомагає вам повністю зрозуміти, що вас запитують.\n\n2️⃣ <b>Знайдіть хвилину для роздумів</b> - Подумайте про запитання та вашу чесну відповідь.\n\n3️⃣ <b>Говоріть відкрито та природно</b> - Поділіться своїми думками, почуттями та досвідом своїми словами. Немає правильних чи неправильних відповідей.\n\n⏱️ <b>Мінімальна тривалість:</b> Ваше голосове повідомлення має триватись щонайменше <b>5 секунд</b>.\n\n✨ Ваші детальні та чесні відповіді допомагають нам краще розуміти закономірності психічного здоров'я. Дякуємо!"
end_main_survey_message: "Дякуємо за участь у опитуванні!\n\n⚠️ <b>Важливо:</b> Не забудьте повідомити координатору ваш ID: <b>{user_id}</b>"
voice_out_of_survey: "Ви поза опитуванням, де потрібно відповідати голосовими повідомленнями. Введіть /start щоб почати знову."
voice_recieved: "Ваше голосове повідомлення отримано. Якщо бажаєте надіслати ще одну відповідь — зробіть це. Інакше можете перейти до наступного або попереднього питання."
