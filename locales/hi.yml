main_survey_disclaimer_message: "💬 <b>कैसे उत्तर दें:</b>\n\nप्रत्येक प्रश्न के लिए, कृपया वॉइस संदेश रिकॉर्ड करके <b>विचारशील और विस्तृत उत्तर</b> दें। हम अनुशंसा करते हैं:\n\n1️⃣ <b>प्रश्न को जोर से पढ़ें</b> - यह आपको पूरी तरह समझने में मदद करता है।\n\n2️⃣ <b>सोचने के लिए एक पल लें</b> - प्रश्न और अपने ईमानदार उत्तर पर विचार करें।\n\n3️⃣ <b>खुले दिल से और स्वाभाविक रूप से बात करें</b> - अपने विचार, भावनाएं और अनुभव अपने शब्दों में साझा करें। कोई सही या गलत उत्तर नहीं है।\n\n⏱️ <b>न्यूनतम अवधि:</b> आपका वॉइस संदेश कम से कम <b>5 सेकंड</b> का होना चाहिए।\n\n✨ आपके विस्तृत और ईमानदार उत्तर हमें मानसिक स्वास्थ्य पैटर्न को बेहतर ढंग से समझने में मदद करते हैं। धन्यवाद!"
