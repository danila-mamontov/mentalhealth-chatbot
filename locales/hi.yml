consent_message: "डेटा सुरक्षा की जानकारी और सहमति\nवैज्ञानिक अध्ययन में आपके व्यक्तिगत एवं चिकित्सीय डेटा एकत्र किए जाते हैं। इनका संग्रह, उपयोग और साझाकरण कानून के अनुसार होता है और भागीदारी से पहले आपकी स्वैच्छिक सहमति आवश्यक है:\n1. मैं सहमत हूँ कि एकत्र डेटा को बिना नाम के संसाधित किया जाए।\n2. अधिकृत एवं गोपनीयता-बंध व्यक्ति (प्रायोजक/विश्वविद्यालय) परियोजना जाँच हेतु डेटा देख सकता है।\n3. मुझे अपने व्यक्तिगत डेटा को देखने, उसकी प्रति पाने, सुधारने या हटाने का अधिकार है।"
