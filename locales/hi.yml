reading_text_intro_msg: "📖 <b>अगला चरण: पाठ पढ़ना</b>\n\nकृपया निम्नलिखित पाठ को जोर से पढ़ें और अपनी पढ़ाई के साथ एक वॉयस संदेश भेजें।\n\n<b>📌 निर्देश:</b>\n1. नीचे दिया गया पाठ पढ़ें\n2. इसे वॉयस संदेश में रिकॉर्ड करें\n3. स्पष्ट और प्राकृतिक रूप से बोलें\n4. वॉयस संदेश भेजें"
reading_text_content_msg: "<b>पढ़ने के लिए पाठ:</b>\n\n\"एक बार एक युवा चरवाहे लड़के की कहानी है जो एक गाँव के पास भेड़ों का झुंड चराता था, एक अंधकारमय जंगल के पास। उसे जीवन बोरिंग लगता था, इसलिए उसने मज़ाक करने का फैसला किया।\n\nएक दिन उसने एक मजाक सोचा: वह तेज़ी से गाँव की ओर दौड़ा और जोर से चिल्लाया: 'भेड़िया! भेड़िया!' गाँव के लोगों ने अपना काम छोड़ दिया और चरागाह की ओर दौड़ पड़े, लेकिन वहाँ कोई भेड़िया नहीं था, और लड़का उनकी घबराहट पर हँस रहा था।\n\nउसने ऐसा कई बार किया। जब आखिरकार एक असली भेड़िया आया और भेड़ों पर हमला करने लगा, तो लड़का डर के साथ गाँव की ओर दौड़ा और फिर से चिल्लाया: 'भेड़िया! भेड़िया!' लेकिन इस बार गाँव के लोगों ने उस पर विश्वास नहीं किया, सोचा कि वह फिर से मजाक कर रहा है।\n\nभेड़िए ने कई भेड़ों को मार डाला और चला गया, और लड़के को समझ आ गया कि उसकी झूठी चिल्लाहट की वजह से जब मदद की वास्तविक ज़रूरत थी तो कोई भी उसकी मदद के लिए नहीं आया।\""
reading_text_instruction_msg: "🎙️ कृपया पाठ को जोर से पढ़ें और अपनी पढ़ाई के साथ एक वॉयस संदेश भेजें।\n\n<b>💬 पढ़ने का तरीका:</b>\n1. स्पष्ट और सुस्पष्ट रूप से बोलें\n2. प्राकृतिक गति बनाए रखें\n3. न्यूनतम रिकॉर्डिंग समय - 10 सेकंड"
