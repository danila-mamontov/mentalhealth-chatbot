reading_text_intro_msg: "📖 <b>Последний этап: Чтение текста</b>\n\nПожалуйста, прочитайте вслух следующий отрывок текста и отправьте голосовое сообщение."
reading_text_content_msg: "<b>Текст для чтения:</b>\n\n\"Жил‑был мальчик‑пастух, который пас стадо овец возле деревни, недалеко от тёмного леса. Жизнь ему казалась скучной, и он решил развлечься.\n\nОднажды он придумал шутку: резко побежал к деревне и закричал изо всех сил: «Волк! Волк!» Жители деревни бросили свои дела и прибежали на пастбище, но там не было ни волка, и мальчик смеялся над их переполохом.\n\nТак он поступал несколько раз. Когда наконец настоящий волк появился и стал нападать на овец, мальчик в ужасе побежал к деревне и снова кричал: «Волк! Волк!» Но на этот раз жители ему не поверили, подумав, что он снова шутит.\n\nВолк растерзал многих овец и ушёл, а мальчик понял, что из‑за своих ложных криков никто не пришёл на помощь, когда помощь была действительно нужна.\""
reading_text_instruction_msg: "🎙️ Пожалуйста, прочитайте текст вслух и отправьте голосовое сообщение со своим чтением.\n\n<b>💬 Инструкция:</b>\n1. Ознакомьтесь с текстом выше\n2. Запишите голосовым сообщением как вы читаете этот текст."
reading_text_confirm_msg: "✅ <b>Вы прочитали текст полностью?</b>\n\nПожалуйста, проверьте, что вы полностью прочитали текст. Если нет, то вы можете продолжить чтение с того места, на котором остановились, и отправить новое голосовое сообщение."
reading_text_recorded_msg: "✅ Ваша запись получена! Спасибо за участие в исследовании."
reading_text_too_short_msg: "⏱️ Запись слишком короткая. Ваш ответ не был сохранен. Пожалуйста, прочитайте текст полностью. Минимальная длина - 10 секунд."
