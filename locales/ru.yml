voice_answer_expected_msg: "🎙️ Пожалуйста, ответьте голосовым сообщением.\n\n💬 <b>Как отвечать:</b>\n1. Прочитайте вопрос вслух\n2. Подумайте немного о своём ответе\n3. Говорите открыто и развёрнуто, делясь своими мыслями, чувствами и опытом своими словами. Нет правильных или неправильных ответов."
