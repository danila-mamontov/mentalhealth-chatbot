welcome_message: "👋 Здравствуйте!\n\n<b>Этот бот — часть научного исследования</b> по автоматическому распознаванию депрессивных состояний.\n\n📊 Мы собираем информацию, чтобы <b>улучшить качество</b> автоматического распознавания.\n\n🙏 Мы будем очень благодарны, если вы примете участие."
info_message: "❗ Если в процессе взаимодействия вы почувствуете дискомфорт или вам потребуется поддержка, рекомендуем обратиться к профессионалам:\n📞 <b>Телефоны доверия:</b> (укажите актуальные контакты)\n🏥 <b>Профессиональная помощь:</b> Если у вас есть вопросы касательно вашего эмоционального состояния, обратитесь к психологу или психотерапевту.\n👨‍👩‍👧‍👦 <b>Поговорите с близкими:</b> Обсуждение своих чувств с людьми, которым вы доверяете, может помочь.\n\n"
